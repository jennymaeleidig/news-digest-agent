name: Daily digest

on:
  schedule:
    # 15:17 UTC daily. Lands ~8:17am PDT (about 8 months/year) and
    # ~7:17am PST in winter. The non-round minute avoids GitHub Actions
    # queue contention at the top of the hour, which can delay or skip
    # scheduled runs entirely. Cron is always UTC; we accept the
    # seasonal hour shift.
    - cron: "17 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write            # required so we can commit data/ files back to the repo
  copilot-requests: write    # required for Copilot CLI requests via GITHUB_TOKEN

# Prevent overlapping runs (manual trigger during a scheduled run, etc.)
# from racing on the git push at the end.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Install Copilot CLI
        # Pin a known-good version once verified; @latest tracks releases that
        # can change the -p/--no-ask-user/--yolo flag surface underneath us.
        run: npm install -g @github/copilot

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        # Curation runs through the Copilot CLI (a flat seat; the old provider
        # API-key secrets were removed with the provider swap). Copilot
        # authenticates via the workflow's GITHUB_TOKEN (no PAT), billed to
        # the account/organization with Copilot CLI enabled; the
        # `copilot-requests: write` permission on the job enables it. To bill
        # a specific user's Copilot seat instead, swap GITHUB_TOKEN for a
        # fine-grained PAT with the "Copilot Requests" permission:
        #   COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        # The same Copilot path is used locally, which works locally too
        # (one-time interactive login: run `copilot`, then `/login`, or
        # `gh auth login`).
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python main.py

      # Always commit state changes, even if the digest run failed:
      # source_health.json and run_log.jsonl are most useful when
      # something went wrong, so we want them captured either way.
      - name: Commit state changes
        if: always()
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add only files that exist; on the very first run run_log.jsonl
          # may not yet exist if main.py crashed before its first append.
          for f in data/seen_items.json data/source_health.json data/run_log.jsonl; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore: update state files ($(date -u +%Y-%m-%d))"
          git push

  # Smoke-test the three new network-backed fetchers (Hugging Face Daily
  # Papers, AI Release Tracker, radarai.top) from the same datacenter-IP
  # environment the scheduled digest run executes from. A fetch that works on
  # a local residential IP is not sufficient evidence a source holds up where
  # the digest actually runs; this job fails unless each returns a full body
  # that maps to non-empty items (see scripts/smoke_test_fetchers.py). It runs
  # within the same 10-minute timeout and same dependency set as run-digest and
  # never retries a host, so it cannot hammer any of the sites it exercises.
  smoke-test-fetchers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke-test network-backed fetchers (datacenter IP)
        # Exits non-zero if any of the three network-backed fetchers fails or
        # returns an empty body from this environment, so a scrape that only
        # works locally fails here and blocks claiming the effort complete.
        run: python scripts/smoke_test_fetchers.py
