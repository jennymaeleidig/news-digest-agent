# Fetcher smoke test — every source, every category.
#
# Smoke-tests ALL sources in ALL discovered categories (one stage per
# category — RSS feeds, keyless YouTube Atom feeds, and the network-backed
# JSON/HTML fetchers alike) from the same datacenter-IP environment the
# scheduled digest workflows execute from. A fetch that works on a local
# residential IP is not sufficient evidence a source holds up where the digest
# actually runs; this workflow fails unless each source returns a full body
# that maps to non-empty items (see scripts/smoke_test_fetchers.py). YouTube
# sources additionally get one transcript attempt per channel — reported as a
# warning (isolate-and-continue keeps the item judgable) but surfaced because
# it is the datacenter-IP signal a laptop run cannot provide. It runs within
# a 10-minute timeout and the same dependency set as the digest workflows and
# never retries a host, so it cannot hammer any of the sites it exercises.
#
# Scheduled after the last digest of the staggered morning block (AI 08:00,
# Tech 08:30, Video games 09:00, US 09:30, Global 10:00, Local 10:30 UTC); the
# non-round minute avoids GitHub Actions queue contention at the top of the
# hour, which can delay or skip scheduled runs entirely. Cron is always UTC.
name: Smoke-test fetchers

on:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch: {}

jobs:
  smoke-test-fetchers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke-test all category sources (datacenter IP)
        # Exits non-zero if any source in any category fails or returns an
        # empty body from this environment, so a scrape that only
        # works locally fails here and blocks claiming the effort complete.
        # Run as a module (not `python scripts/…`) so the repo root lands on
        # sys.path and the top-level `categories` / `fetchers` imports resolve.
        # Optional secret: routes only the transcript attempts through an
        # outbound HTTP proxy (YouTube blocks transcript requests from this
        # datacenter IP). Unset → transcript attempts stay direct and print
        # the familiar RequestBlocked warning.
        env:
          YT_TRANSCRIPT_PROXY_URL: ${{ secrets.YT_TRANSCRIPT_PROXY_URL }}
        run: python -m scripts.smoke_test_fetchers
